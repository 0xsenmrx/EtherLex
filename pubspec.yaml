name: etherlex
description: EtherLex, a fast, keyboard-first desktop companion for Canvas LMS.
publish_to: 'none'
version: 0.3.0+5

environment:
  sdk: ^3.13.0
  # Flutter 3.50.0 hangs the GPU while pdfrx decodes page images (flutter/flutter#196618).
  # Stay on 3.47.x until that is fixed upstream.
  flutter: ">=3.47.0 <3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.4.0
  go_router: ^17.0.0
  dio: ^5.9.2
  crypto: ^3.0.0
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  sqlite3: ^3.8.0
  desktop_drop: ^0.7.1
  pdfrx: ^2.6.4
  file_selector: ^1.0.3
  local_notifier: ^0.1.6
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
