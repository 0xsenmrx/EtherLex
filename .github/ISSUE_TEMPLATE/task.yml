name: Task or idea
description: A feature, cleanup or follow-up
labels: [enhancement]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves or the goal.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to do
      description: The change, in a few lines. Options with trade-offs are welcome.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
    validations:
      required: true
