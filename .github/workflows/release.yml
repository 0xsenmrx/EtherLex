name: Release
on:
  push:
    tags: ['v*']

# Creating the GitHub release needs write access; new repositories give the
# workflow token read-only access by default.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\etherlex.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/EtherLex-Setup-*.exe
